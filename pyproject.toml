[project]
name = "campus"
version = "0.1.0"
description = "Campus — a production-grade e-learning SaaS platform"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "django-ninja-extra>=0.21",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "django-redis>=5.4",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "django-celery-results>=2.5",
    "channels[daphne]>=4.1",
    "channels-redis>=4.2",
    "django-storages[s3]>=1.14",
    "pillow>=11.0",
    "python-decouple>=3.8",
    "structlog>=24.4",
    "django-structlog>=8.1",
    "djangorestframework-simplejwt>=5.3",
    "social-auth-app-django>=5.4",
    "django-ratelimit>=4.1",
    "django-htmx>=1.21",
    "stripe>=11.0",
    "weasyprint>=63.0",
    "markdown>=3.7",
    "bleach>=6.2",
    "httpx>=0.28",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "faker>=33.0",
    "ruff>=0.8",
    "black>=24.0",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "django-debug-toolbar>=4.4",
    "ipython>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "DJ", "RUF"]
ignore = ["E501", "B008", "RUF012", "DJ001", "DJ012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "shared", "config", "infrastructure", "api", "core"]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = ["**/migrations/**", "**/__pycache__/**", ".venv/**"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "--ds=config.settings.testing --cov=apps --cov=shared --cov=core --cov=api --cov-report=term-missing -p no:cacheprovider"

[tool.coverage.run]
source = ["apps", "shared", "core", "api"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
skip_empty = true
