<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: A4 landscape; margin: 0; }
    body { font-family: "Helvetica", "Arial", sans-serif; margin: 0; }
    .frame {
      box-sizing: border-box; height: 100vh; padding: 60px;
      border: 14px solid #4f46e5; text-align: center;
      display: flex; flex-direction: column; justify-content: center;
    }
    .kicker { letter-spacing: 6px; text-transform: uppercase; color: #6b7280; font-size: 14px; }
    .brand { font-size: 26px; font-weight: bold; color: #4f46e5; margin-top: 8px; }
    h1 { font-size: 44px; margin: 30px 0 10px; }
    .name { font-size: 34px; color: #111827; margin: 18px 0; border-bottom: 2px solid #e5e7eb; display: inline-block; padding-bottom: 6px; }
    .course { font-size: 22px; color: #374151; margin-top: 10px; }
    .meta { margin-top: 40px; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="kicker">Certificate of Completion</div>
    <div class="brand">● Campus</div>
    <h1>Certificate of Completion</h1>
    <p>This certifies that</p>
    <div class="name">{{ student }}</div>
    <p>has successfully completed</p>
    <div class="course">{{ course }}</div>
    <div class="meta">
      Issued {{ date }} · Serial {{ serial }}<br>
      Verify at /verify/{{ serial }}/
    </div>
  </div>
</body>
</html>
