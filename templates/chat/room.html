{% extends "base.html" %}
{% block title %}Chat · {{ course.title }} — Campus{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl" x-data="chatRoom('{{ course.slug }}')">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">{{ course.title }} · Chat</h1>
    <a href="{% url 'progress:classroom' course.slug %}" class="text-sm text-zinc-400 hover:text-white">← Course</a>
  </div>

  <div id="messages" class="mt-4 h-96 space-y-3 overflow-y-auto rounded-lg border border-zinc-800 bg-zinc-900 p-4">
    {% for m in messages %}
      <div>
        <span class="text-sm font-medium text-brand-400">{{ m.author.display_name }}</span>
        <span class="text-xs text-zinc-500">{{ m.created_at|time:"H:i" }}</span>
        <p class="text-sm text-zinc-200">{{ m.body }}</p>
      </div>
    {% endfor %}
  </div>

  <form @submit.prevent="send" class="mt-3 flex gap-2">
    <input x-model="draft" placeholder="Write a message" maxlength="2000" autocomplete="off">
    <button class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium hover:bg-brand-500">Send</button>
  </form>
</div>

<script>
function chatRoom(slug) {
  return {
    draft: "",
    socket: null,
    init() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      this.socket = new WebSocket(`${proto}://${location.host}/ws/chat/${slug}/`);
      this.socket.onmessage = (e) => this.append(JSON.parse(e.data));
    },
    append(msg) {
      if (msg.error) return;
      const box = document.getElementById("messages");
      const el = document.createElement("div");
      el.innerHTML = `<span class="text-sm font-medium text-brand-400"></span>
        <p class="text-sm text-zinc-200"></p>`;
      el.querySelector("span").textContent = msg.author;
      el.querySelector("p").textContent = msg.body;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    },
    send() {
      if (!this.draft.trim()) return;
      this.socket.send(JSON.stringify({ body: this.draft }));
      this.draft = "";
    },
  };
}
</script>
{% endblock %}
