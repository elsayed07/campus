{% extends "base.html" %}
{% block title %}Notifications — Campus{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">Notifications</h1>
    {% if notifications %}
      <form method="post" action="{% url 'notifications:read_all' %}">
        {% csrf_token %}
        <button class="text-sm text-brand-500 hover:underline">Mark all read</button>
      </form>
    {% endif %}
  </div>

  <ul class="mt-6 space-y-2">
    {% for n in notifications %}
      <li class="rounded-lg border px-4 py-3 {% if n.is_read %}border-zinc-800 bg-zinc-900{% else %}border-brand-700 bg-zinc-900{% endif %}">
        <form method="post" action="{% url 'notifications:read_one' n.id %}">
          {% csrf_token %}
          <button class="block w-full text-left">
            <div class="flex items-center justify-between">
              <span class="font-medium">{{ n.title }}</span>
              <span class="text-xs text-zinc-500">{{ n.created_at|timesince }} ago</span>
            </div>
            {% if n.body %}<p class="mt-1 text-sm text-zinc-400">{{ n.body }}</p>{% endif %}
          </button>
        </form>
      </li>
    {% empty %}
      <li class="rounded-lg border border-zinc-800 bg-zinc-900 px-4 py-6 text-center text-zinc-500">
        Nothing here yet.
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
